version: '3.8'

services:
  plex-newsletter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: plex-newsletter
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${PREVIEW_PORT:-3000}:3000"
    volumes:
      - ../logs:/app/logs
    environment:
      - NODE_ENV=production
